# MediaVault 本番用 docker-compose.yml
#
# ローカル結合確認用の docker-compose.test.yml (旧 docker-compose.yml) とは別ファイル。
# 自作サービス (mediavault-api / mediavault-web / mediavault-worker / mediavault-mcp) は
# 本リポジトリのソースからローカル build する（GHCRのイメージは参照しない）。
# バンドルOSS (Jellyfin / Calibre-Web) のイメージタグは本ファイルに直接固定する（:latest は使わない）。
# 環境依存値・秘密のみ .env に外だしする（.env.production.example を参照）。
#
# 起動例:
#   cp .env.production.example .env.production
#   docker compose -p mediavault --env-file .env.production up -d --build
#
# マイグレーションは mediavault-api が起動時に自ら適用する
# （backend/mediavault-api/src/main.rs の db::run_migrations）。専用の migrate サービスは持たない。
#
# 参照元設計:
#   インフラ設計/デバイス/ミニPC/サービス/MediaVault/README.md
#   インフラ設計/デバイス/ミニPC/README.md

services:
  postgres:
    image: postgres:16
    container_name: mediavault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      TZ: ${TZ:-Asia/Tokyo}
    volumes:
      - ${DATA_ROOT:-/srv}/db/mediavault-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DB:?}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - db-net
    # ホストへのポート公開はしない（db-net内部のみ）

  mediavault-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: mediavault-api:local
    container_name: mediavault-api
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      MEDIA_ROOT: /data/media
      DOCUMENTS_ROOT: /data/documents
      # アップロード書込先。mediavault-api は MEDIA_ROOT ではなく *_STORAGE_PATH を参照する
      # （backend/mediavault-api/src/services/file_storage.rs の resolve_base_dir）。
      # 未設定だと既定の /srv/media/photos・/srv/files/pdf へ書かれ、下のマウント外となり消える。
      MEDIA_STORAGE_PATH: /data/media/photos
      PDF_STORAGE_PATH: /data/documents/pdf
      SEARCH_BACKEND: ${SEARCH_BACKEND:-postgres}
      MEILI_URL: ${MEILI_URL:-}
      # /internal/* のBearer認証キー。未設定だと空文字となり内部APIが無認証になるため必須扱い
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      # 単一オリジンのみ指定可。不正値は起動時panic（main.rs）
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-https://mediavault.aoton.win}
      # 外部メタデータAPIの認証情報（未設定のプロバイダは起動時seedをスキップする）
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      STEAM_USER_ID: ${STEAM_USER_ID:-}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
      ANNICT_ACCESS_TOKEN: ${ANNICT_ACCESS_TOKEN:-}
      RAKUTEN_APPLICATION_ID: ${RAKUTEN_APPLICATION_ID:-}
      RAKUTEN_ACCESS_KEY: ${RAKUTEN_ACCESS_KEY:-}
    volumes:
      - ${MEDIA_ROOT:-/srv/media}:/data/media
      - ${DOCUMENTS_ROOT:-/srv/documents}:/data/documents
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      db-net:
      proxy-net:
        # mediavault-web の nginx.conf は upstream を `backend` というホスト名で参照する
        # （docker-compose.test.yml のサービス名に合わせてある）。本番のサービス名は
        # mediavault-api なので、nginx.conf を環境ごとに分けずに済むようエイリアスを与える。
        aliases:
          - backend
    # ホストへのポート公開はしない（proxy-net経由でのみ公開）

  mediavault-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: mediavault-web:local
    container_name: mediavault-web
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tokyo}
    depends_on:
      mediavault-api:
        condition: service_healthy
    networks:
      - proxy-net
    # ホストへのポート公開はしない（proxy-net経由でのみ公開）

  mediavault-worker:
    # 【未実装】backend/Dockerfile.worker は未作成のため、現時点では build が失敗する。
    # worker の実装が入るまでは `docker compose up` 時に本サービスを除外すること:
    #   docker compose -p mediavault --env-file .env.production up -d --build \
    #     postgres mediavault-api mediavault-web jellyfin calibre-web
    # 設計は docs/backend/mediavault-worker/PRD.md を参照。
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    image: mediavault-worker:local
    container_name: mediavault-worker
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      MEDIA_ROOT: /data/media
      DOCUMENTS_ROOT: /data/documents
      SEARCH_BACKEND: ${SEARCH_BACKEND:-postgres}
      MEILI_URL: ${MEILI_URL:-}
      # wiki/embed を自ら実行する場合のみ使用（既定は KnowledgeHub 側エージェントに委譲）
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    volumes:
      - ${MEDIA_ROOT:-/srv/media}:/data/media
      - ${DOCUMENTS_ROOT:-/srv/documents}:/data/documents
    depends_on:
      postgres:
        condition: service_healthy
      # マイグレーション適用は mediavault-api が担うため、その起動完了を待つ
      mediavault-api:
        condition: service_healthy
    networks:
      - db-net
    # proxy-net には参加しない（ホスト非公開、db-net経由でのみ postgres/data にアクセス）

  mediavault-mcp:
    # 【未実装】backend/Dockerfile.mcp は未作成のため、現時点では build が失敗する。
    # 設計は docs/backend/mediavault-mcp/PRD.md を参照。
    build:
      context: ./backend
      dockerfile: Dockerfile.mcp
    image: mediavault-mcp:local
    container_name: mediavault-mcp
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      MEDIAVAULT_API_BASE_URL: http://mediavault-api:8080
    depends_on:
      mediavault-api:
        condition: service_healthy
    networks:
      - proxy-net
    # ホストへのポート公開はしない（proxy-net経由でのみ公開。外部MCPクライアントは`mcp.`FQDN、
    # KnowledgeHub側常駐エージェントは内部網から直接到達する想定）

  jellyfin:
    # バンドルOSSはメジャーバージョン固定で直接埋め込む（:latest は使用しない）
    image: jellyfin/jellyfin:10
    container_name: mediavault-jellyfin
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - ${DATA_ROOT:-/srv}/db/jellyfin/config:/config
      - ${MEDIA_ROOT:-/srv/media}/video:/data/media/video
      - ${MEDIA_ROOT:-/srv/media}/photo:/data/media/photo
    networks:
      - proxy-net
    # ホストへのポート公開はしない（proxy-net経由、jellyfin.aoton.win でCaddy公開）

  calibre-web:
    # バンドルOSSはメジャーバージョン固定で直接埋め込む（:latest は使用しない）
    image: lscr.io/linuxserver/calibre-web:0.6
    container_name: mediavault-calibre-web
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      DOCKER_MODS: linuxserver/mods:universal-calibre
    volumes:
      - ${DATA_ROOT:-/srv}/db/calibre-web:/config
      - ${DATA_ROOT:-/srv}/db/calibre-web/library:/books
      - ${DOCUMENTS_ROOT:-/srv/documents}/pdf:/imports/pdf:ro
      - ${DOCUMENTS_ROOT:-/srv/documents}/manga:/imports/manga:ro
    networks:
      - proxy-net
    # ホストへのポート公開はしない（proxy-net経由、calibre.aoton.win でCaddy公開）
    # Calibre-Webからmediavault-apiへのコールバックは行わない（一方向設計）

networks:
  db-net:
    # MediaVault-api/worker と postgres の内部接続専用。本compose内で完結し、外部公開しない
    driver: bridge
  proxy-net:
    # グループ外（上位のリバースプロキシ用compose）で用意され注入されるネットワーク
    external: true
    name: ${PROXY_NET_NAME:-proxy-net}
