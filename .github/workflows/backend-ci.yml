name: backend-ci

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: backend

env:
  CARGO_TERM_COLOR: always
  POSTGRES_USER: mediavault
  POSTGRES_PASSWORD: changeme
  POSTGRES_DB: mediavault
  DATABASE_URL: postgresql://mediavault:changeme@localhost:5432/mediavault
  INTERNAL_API_KEY: ci-test-key

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mediavault
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: mediavault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mediavault -d mediavault"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres,rustls --locked

      - name: Run database migrations
        run: sqlx migrate run --source mediavault-api/migrations

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests (unit + TASK-0032 integration tests)
        run: cargo test --workspace --all-targets -- --include-ignored
