[project]
name = "mediavault-extractor"
version = "0.1.0"
description = "MediaVault extraction worker"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pillow>=11.3.0",
    "puremagic>=1.30",
    "pydantic-settings>=2.10.1",
    "pypdfium2>=4.30.0",
    "structlog>=25.4.0",
    "tenacity>=9.1.2",
    "yomitoku>=0.7.0",
]

[dependency-groups]
dev = [
    "mypy>=1.17.1",
    "pytest>=8.4.1",
    "pytest-mock>=3.14.1",
    "ruff>=0.12.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mediavault_extractor"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

