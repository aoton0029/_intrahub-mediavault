# ミニPC デプロイ用 (開発用 docker-compose.yml とは別ファイル)。
# minipc-compose の include には入れず、MediaVault 単独の compose プロジェクトとして起動する:
#   docker compose -p mediavault -f docker-compose.minipc.yml --env-file .env.minipc up -d
# backend / frontend は GitHub Actions でビルドし GHCR から配信する自作イメージ
# (コミット SHA タグ固定。タグは .env の MEDIAVAULT_*_IMAGE で指定する)。
# selfhosted-net / db-net / proxy-net は minipc-compose 側が作成する固定名ネットワークを external 参照する。
services:
  mediavault-backend:
    image: ${MEDIAVAULT_BACKEND_IMAGE:?}
    container_name: mediavault-backend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@mediavault-postgres:5432/${POSTGRES_DB:?}
      # /internal API のキー(KindleOCR / Hermes-Agent 等の内部クライアントが使用)
      MEDIAVAULT_INTERNAL_API_KEY: ${MEDIAVAULT_INTERNAL_API_KEY:?}
    volumes:
      # 実ファイルは Samba 共有と同じ実体を bind mount し、backend は相対パスのみ管理する
      - ${DATA_ROOT:-/srv}/files/pdf:/srv/files/pdf
      - ${DATA_ROOT:-/srv}/media/photos:/srv/media/photos
      - ${DATA_ROOT:-/srv}/media/videos:/srv/media/videos
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      mediavault-postgres:
        condition: service_healthy
    networks:
      - selfhosted-net
      - db-net
      - proxy-net

  mediavault-frontend:
    image: ${MEDIAVAULT_FRONTEND_IMAGE:?}
    container_name: mediavault-frontend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tokyo}
    depends_on:
      mediavault-backend:
        condition: service_healthy
    networks:
      - selfhosted-net
      - proxy-net

  mediavault-postgres:
    image: postgres:16
    container_name: mediavault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - ${DATA_ROOT:-/srv}/db/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DB:?}"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - db-net

networks:
  selfhosted-net:
    external: true
  db-net:
    external: true
  proxy-net:
    external: true
