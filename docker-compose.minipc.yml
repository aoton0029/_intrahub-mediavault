# ミニPC（自宅インフラ minipc-compose）構成で MediaVault を起動するためのファイル。
# ルートの docker-compose.yml はローカル起動テスト用として残している。
#
# 前提:
#   - minipc-compose/docker-compose.yml (core) が固定名ネットワーク selfhosted-net / db-net を
#     作成済みで、postgres コンテナが db-net 上で稼働していること。
#   - 環境変数はソースコード側（./backend/.env および ルート ./.env）を正とする。
#
# 起動:
#   docker compose -f docker-compose.minipc.yml up -d --build

services:
  mediavault-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mediavault-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # DB は core compose 側の postgres コンテナを使うため、接続先ホスト名のみ上書きする。
      # 認証情報（POSTGRES_*）はルート .env から補間され、ソース側 .env と同一の値になる。
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - /srv/files/pdf:/srv/files/pdf
      - /srv/media/photos:/srv/media/photos
      - /srv/media/videos:/srv/media/videos
    networks:
      selfhosted-net:
        aliases:
          # frontend の nginx.conf が http://backend:8080 を参照するためのエイリアス
          - backend
      db-net: {}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  mediavault-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mediavault-frontend
    restart: unless-stopped
    networks:
      - selfhosted-net
    depends_on:
      mediavault-backend:
        condition: service_healthy

networks:
  # minipc-compose (core) 側で作成される固定名ネットワークに相乗りする
  selfhosted-net:
    external: true
    name: selfhosted-net
  db-net:
    external: true
    name: db-net
