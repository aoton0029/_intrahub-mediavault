[package]
name = "mediavault-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
tokio = { version = "1.52.3", features = ["full"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "macros", "chrono", "uuid", "migrate"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
api-client-lib = { path = "../api-client-lib" }
csv = "1.3"
encoding_rs = "0.8"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
