# MediaVault ローカル結合確認用 docker-compose
#
# 本番用は docker-compose.yml（GHCRのイメージを参照）。こちらはローカルbuildする。
#
# 環境変数の持ち方（3層。詳細は README.md「環境変数ファイルの構成」）:
#   .env.test        … 本ファイル内の ${...} 展開用（POSTGRES_* / PGADMIN_*）
#   backend/.env     … backendコンテナに渡すアプリ設定（env_file で読み込む）
#   frontend/.env    … vite開発サーバー専用。本composeでは使わない
#
# 起動例:
#   cp .env.test.example .env.test
#   cp backend/.env.example backend/.env
#   docker compose -f docker-compose.test.yml --env-file .env.test up -d
#
# 注意: backend/.env の DATABASE_URL は素の cargo run 用に localhost を指している。
#       本compose内ではホスト名が db になるため、backendサービスの environment: で
#       上書きしている（compose の environment: は env_file より優先される）。

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - mediavault_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      PGPASS_FILE: /pgpass
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./docker/pgadmin/pgpass:/pgpass:ro
    ports:
      - "5050:80"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # 外部APIキー・INTERNAL_API_KEY はローカル開発用にまとめて注入する
    env_file:
      - ./backend/.env
    # コンテナ内のネットワーク事情に依存する値は env_file より優先させて上書きする
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MEDIA_STORAGE_PATH: /data/media/photos
      PDF_STORAGE_PATH: /data/documents/pdf
    volumes:
      - mediavault_files:/data
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mediavault_pgdata:
  # backendのアップロード先（MEDIA_STORAGE_PATH / PDF_STORAGE_PATH）。
  # コンテナ再作成でアップロード済みファイルが消えないよう名前付きvolumeにする。
  mediavault_files:
