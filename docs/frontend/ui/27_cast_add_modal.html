<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>MediaVault — キャストを追加</title>
<link rel="stylesheet" href="_shared.css">
<script src="_shared.js" defer></script>
</head>
<body>
<div class="app-shell">

  <!-- サイドバー(16_anime_detail.htmlと共通。背景として薄く見せる用途のため active は付けない) -->
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span>MediaVault</div>

    <div class="nav-section">
      <a href="01_home.html" class="nav-item" style="text-decoration:none;">📚 ホーム<span class="count">128</span></a>
    </div>
    <div class="nav-section">
      <div class="nav-section-label">メディア</div>
      <a href="02_general_media.html" class="nav-item active" style="text-decoration:none;">🎬 すべて<span class="count">96</span></a>
      <a href="02_general_media.html" class="nav-item" style="text-decoration:none;">🎥 映画<span class="count">9</span></a>
      <a href="02_general_media.html" class="nav-item" style="text-decoration:none;">📽️ ドラマ</a>
      <a href="02_general_media.html" class="nav-item" style="text-decoration:none;">📺 アニメ<span class="count">28</span></a>
      <a href="02_general_media.html" class="nav-item" style="text-decoration:none;">📘 漫画<span class="count">34</span></a>
      <a href="02_general_media.html" class="nav-item" style="text-decoration:none;">📖 小説<span class="count">15</span></a>
      <a href="02_general_media.html" class="nav-item" style="text-decoration:none;">🎮 ゲーム<span class="count">3</span></a>
    </div>

    <div class="nav-section">
      <div class="nav-section-label">リサーチ</div>
      <a href="03_academic_books.html" class="nav-item" style="text-decoration:none;">🎓 学術書・専門書<span class="count">21</span></a>
      <a href="04_papers.html" class="nav-item" style="text-decoration:none;">📄 論文・文献<span class="count">11</span></a>
    </div>

    <div class="nav-section">
      <div class="nav-section-label">コレクション</div>
      <a href="06_mylists.html" class="nav-item" style="text-decoration:none;">⭐ マイリスト</a>
    </div>

    <div class="nav-section" style="margin-top: auto;">
      <div class="nav-section-label">Misc</div>
      <a href="19_settings.html" class="nav-item" style="text-decoration:none;">⚙️ 設定</a>
      <button type="button" class="theme-toggle" data-theme-toggle aria-label="表示モード切替">🌓 ライトモードに切り替え</button>
    </div>
  </aside>

  <!-- メイン(16_anime_detail.htmlのスタッフセクションと同パターンで、キャスト一覧を簡易再現。
       cast は staff と別テーブル(cast_members/item_cast)で role列を持たない -->
  <main class="main">
    <div class="titlebar">
      <div class="breadcrumb"><a href="02_general_media.html">一般メディア</a> <span>/ アニメ</span></div>
    </div>

    <div class="content">
      <div class="detail-layout">
        <aside class="detail-rail">
          <div class="doc-cover"></div>
          <h1 class="doc-title">星屑のシンフォニア</h1>
          <div class="doc-original">Symphonia of Stardust ・ 2025年</div>
        </aside>

        <div class="detail-main">
          <div class="doc-section">
            <h3>
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
              キャスト
            </h3>
            <div class="prop-list-item">
              <span class="label">結城 かなで</span>
              <span class="sub">ルカ役</span>
            </div>
            <div class="prop-list-item">
              <span class="label">霧島 蓮</span>
              <span class="sub">アレン役</span>
            </div>
            <button class="btn btn-ghost btn-sm" style="margin-top: 10px;">キャストを追加</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- キャスト追加モーダル。人物(Cast)は作品と独立したマスタで、既存キャストを検索して選ぶか
       新規登録(POST /cast)してから、キャラ名を添えて作品に紐付ける(POST /items/{id}/cast)。
       staffと異なり role は持たず character_name(役名)のみ任意で指定する -->
  <div class="modal-overlay">
    <div class="modal" style="max-width: 560px;">
      <h2>キャストを追加</h2>

      <!-- 既存キャスト検索: GET /cast?q=... を想定 -->
      <div class="search-box" style="margin-bottom: 14px;">🔍 <input type="text" placeholder="氏名で検索…" value="結城"></div>

      <div class="result-row">
        <div class="thumb" style="border-radius: 999px; width: 44px; height: 44px;"></div>
        <div class="info">
          <div class="title">結城 かなで</div>
          <div class="sub">紐付け作品 8件</div>
        </div>
        <button class="btn btn-accent btn-sm">選択</button>
      </div>
      <div class="result-row">
        <div class="thumb" style="border-radius: 999px; width: 44px; height: 44px;"></div>
        <div class="info">
          <div class="title">結城 彩</div>
          <div class="sub">紐付け作品 1件</div>
        </div>
        <button class="btn btn-accent btn-sm">選択</button>
      </div>

      <hr class="rail-divider">

      <!-- 検索で見つからない場合の新規登録: POST /cast { name, external_id?, image_url? } -->
      <button type="button" class="tag-add-trigger" style="margin-bottom: 12px;">+ 新規キャストを登録</button>
      <div class="form-grid" style="margin-bottom: 18px;">
        <div class="form-field full">
          <label>氏名 <span class="required">*</span></label>
          <input type="text" placeholder="例: 結城 かなで">
        </div>
        <div class="form-field">
          <label>external_id</label>
          <input type="text" placeholder="任意">
        </div>
        <div class="form-field">
          <label>image_url</label>
          <input type="text" placeholder="任意">
        </div>
      </div>

      <hr class="rail-divider">

      <!-- 選択/新規登録した人物を作品に紐付ける際のキャラ名: POST /items/{id}/cast { cast_id, character_name? } -->
      <div class="form-grid">
        <div class="form-field full">
          <label>キャラ名</label>
          <input type="text" placeholder="例: ルカ(任意)" value="ルカ">
        </div>
      </div>

      <div class="form-actions">
        <button class="btn btn-accent">追加</button>
        <button class="btn btn-ghost">キャンセル</button>
      </div>
    </div>
  </div>

</div>
</body>
</html>
