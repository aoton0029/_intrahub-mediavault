    <div class="nav-section">

      <a href="07_tags.html" class="nav-item" style="text-decoration:none;">🏷️ タグ</a>

  <!-- メイン -->
  <main class="main">
    <div class="titlebar">
      <h1>作品を追加</h1>
    </div>

    <div class="content">
      <!-- POST /items ( media_type: academic_book 固定。種別セレクトは無い )。
           種別固有情報は details キーにネストして送信する。 -->
      <form>
        <div class="form-section-title">基本情報</div>
        <div class="form-grid">
          <div class="form-field">
            <label>タイトル<span class="required">必須</span></label>
            <input type="text" placeholder="例: 分散システム設計の原理">
          </div>
          <div class="form-field">
            <label>原題</label>
            <input type="text" placeholder="原著タイトルがある場合に入力">
          </div>
          <div class="form-field">
            <label>発行日</label>
            <input type="date">
          </div>
          <div class="form-field full">
            <label>概要</label>
            <textarea placeholder="内容の概要を入力してください"></textarea>
          </div>
          <div class="form-field">
            <label>表紙画像URL</label>
            <input type="text" placeholder="https://...">
          </div>
          <div class="form-field">
            <label>関連サイトURL</label>
            <input type="text" placeholder="https://...">
          </div>
          <div class="form-field">
            <label>評価</label>
            <input type="number" min="0" max="5" step="0.1" placeholder="0.0 〜 5.0">
          </div>
          <div class="form-field">
            <label>読書状態</label>
            <!-- 実装時は作成後の変更を PATCH /items/{id}/status(status, consumed_date) の別リクエストとして送る -->
            <select>
              <option selected>未着手</option>
              <option>視聴中</option>
              <option>視聴済</option>
            </select>
          </div>
          <div class="form-field">
            <label>お気に入り</label>
            <select>
              <option value="false" selected>登録しない</option>
              <option value="true">お気に入りに登録する</option>
            </select>
          </div>
        </div>

        <div class="form-section-title">種別固有情報</div>
        <div class="form-grid">
          <div class="form-field">
            <label>著者</label>
            <input type="text" placeholder="例: 宮川 慧">
          </div>
          <div class="form-field">
            <label>出版社</label>
            <input type="text" placeholder="例: 技術評論社">
          </div>
          <div class="form-field">
            <label>ISBN</label>
            <input type="text" placeholder="例: 978-4-297-00000-0">
          </div>
          <div class="form-field">
            <label>国立国会図書館ID</label>
            <input type="text" placeholder="NDL書誌ID">
          </div>
          <div class="form-field">
            <label>Google Books ID</label>
            <input type="text" placeholder="Google Books の書誌ID">
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-accent">保存する</button>
          <a href="03_academic_books.html" class="btn btn-ghost">キャンセル</a>
        </div>
      </form>
    </div>
  </main>

</div>
</body>
</html>
