    <div class="nav-section">

  <!-- メイン(16_anime_detail.htmlのスタッフセクションを背景として簡易再現。モーダル表示中の見た目確認用) -->
  <main class="main">
    <div class="titlebar">
      <div class="breadcrumb"><a href="02_general_media.html">メディア</a> <span>/ アニメ</span></div>
    </div>

    <div class="content">
      <div class="detail-layout">
        <aside class="detail-rail">
          <div class="doc-cover"></div>
          <h1 class="doc-title">星屑のシンフォニア</h1>
          <div class="doc-original">Symphonia of Stardust ・ 2025年</div>
        </aside>

        <div class="detail-main">
          <div class="doc-section">
            <h3>
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
              スタッフ
            </h3>
            <div class="prop-list-item">
              <span class="label">新津 明日香</span>
              <span class="sub">監督</span>
            </div>

              <span class="label">結城 かなで</span>

        </div>
      </div>
    </div>
  </main>

  <!-- スタッフ追加モーダル。人物(Staff)は作品と独立したマスタで、既存スタッフを検索して選ぶか
       新規登録(POST /staff)してから、役割・キャラ名を添えて作品に紐付ける(POST /items/{id}/staff)。
       role は必須、character_name(声優時の役名等)は任意。既存スタッフの新規登録要否に応じて
       「新規スタッフを登録」欄の表示/非表示が切り替わる想定(このモックでは常時両方表示) -->
  <div class="modal-overlay">
    <div class="modal" style="max-width: 560px;">
      <h2>スタッフを追加</h2>

      <!-- 既存スタッフ検索: GET /staff?q=... を想定 -->
      <div class="search-box" style="margin-bottom: 14px;">🔍 <input type="text" placeholder="氏名で検索…" value="新津"></div>

      <div class="result-row">
        <div class="thumb" style="border-radius: 999px; width: 44px; height: 44px;"></div>
        <div class="info">
          <div class="title">新津 明日香</div>
          <div class="sub">紐付け作品 12件</div>
        </div>
        <button class="btn btn-accent btn-sm">選択</button>
      </div>
      <div class="result-row">
        <div class="thumb" style="border-radius: 999px; width: 44px; height: 44px;"></div>
        <div class="info">
          <div class="title">新津 光</div>
          <div class="sub">紐付け作品 3件</div>
        </div>
        <button class="btn btn-accent btn-sm">選択</button>
      </div>

      <hr class="rail-divider">

      <!-- 検索で見つからない場合の新規登録: POST /staff { name, external_id?, image_url? } -->
      <button type="button" class="tag-add-trigger" style="margin-bottom: 12px;">+ 新規スタッフを登録</button>
      <div class="form-grid" style="margin-bottom: 18px;">
        <div class="form-field full">
          <label>氏名 <span class="required">*</span></label>
          <input type="text" placeholder="例: 新津 明日香">
        </div>
        <div class="form-field">
          <label>external_id</label>
          <input type="text" placeholder="任意">
        </div>
        <div class="form-field">
          <label>image_url</label>
          <input type="text" placeholder="任意">
        </div>
      </div>

      <hr class="rail-divider">

      <!-- 選択/新規登録した人物を作品に紐付ける際の役割情報: POST /items/{id}/staff { staff_id, role, character_name? } -->
      <div class="form-grid">
        <div class="form-field">
          <label>役割 <span class="required">*</span></label>
          <input type="text" placeholder="例: 監督 / 脚本 / 声優" value="監督">
        </div>
        <div class="form-field">
          <label>キャラ名</label>
          <input type="text" placeholder="声優の場合のみ(任意)">
        </div>
      </div>

      <div class="form-actions">
        <button class="btn btn-accent">追加</button>
        <button class="btn btn-ghost">キャンセル</button>
      </div>
    </div>
  </div>

</div>
</body>
</html>
