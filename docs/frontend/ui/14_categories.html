</head>
<body>
<div class="app-shell">

  <!-- サイドバー(01_home.htmlと共通、「カテゴリ」をactiveに) -->
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span>MediaVault</div>

    <div class="nav-section">
      <a href="01_home.html" class="nav-item" style="text-decoration:none;">📚 全体一覧<span class="count">128</span></a>
      <a href="02_general_media.html" class="nav-item" style="text-decoration:none;">🎬 一般メディア<span class="count">96</span></a>
      <a href="02_general_media.html" class="nav-item indent" style="text-decoration:none;">　アニメ<span class="count">34</span></a>
      <a href="02_general_media.html" class="nav-item indent" style="text-decoration:none;">　映画<span class="count">28</span></a>
      <a href="02_general_media.html" class="nav-item indent" style="text-decoration:none;">　ドラマ<span class="count">9</span></a>
      <a href="02_general_media.html" class="nav-item indent" style="text-decoration:none;">　漫画<span class="count">15</span></a>
      <a href="02_general_media.html" class="nav-item indent" style="text-decoration:none;">　小説<span class="count">7</span></a>
      <a href="02_general_media.html" class="nav-item indent" style="text-decoration:none;">　ゲーム<span class="count">3</span></a>
      <a href="03_academic_books.html" class="nav-item" style="text-decoration:none;">🎓 学術書・専門書<span class="count">21</span></a>
      <a href="04_papers.html" class="nav-item" style="text-decoration:none;">📄 論文・文献<span class="count">11</span></a>
    </div>

    <div class="nav-section">
      <div class="nav-section-label">ライブラリ</div>
      <a href="06_mylists.html" class="nav-item" style="text-decoration:none;">⭐ マイリスト</a>
      <a href="07_tags.html" class="nav-item" style="text-decoration:none;">🏷️ タグ</a>
      <a href="14_categories.html" class="nav-item active" style="text-decoration:none;">📁 カテゴリ</a>
      <a href="14_categories.html" class="nav-item indent" style="text-decoration:none;">　積読<span class="count">12</span></a>
      <a href="14_categories.html" class="nav-item indent" style="text-decoration:none;">　お気に入り原作<span class="count">6</span></a>

      <a href="08_staff.html" class="nav-item" style="text-decoration:none;">👤 スタッフ</a>
    </div>

    <div class="nav-section" style="margin-top: auto;">
      <a href="19_settings.html" class="nav-item" style="text-decoration:none;">⚙️ 設定</a>
    </div>
  </aside>

  <!-- メイン -->
  <main class="main">
    <div class="titlebar">
      <h1>カテゴリ</h1>
    </div>

    <div class="content">
      <p class="field-hint" style="margin-bottom: 20px;">作品をユーザー定義の分類でまとめます。タグの管理は「タグ」ページで行います。</p>

      <!-- ① 操作セクション: 新規追加。パネルとして囲み、一覧セクションと視覚的に区切る。
           POST /categories { name } に対応。409 DUPLICATE_CATEGORY_NAME のエラー表示例も1件示す -->
      <div class="kv-card" style="align-items: flex-start; flex-direction: column; gap: 14px; margin-bottom: 28px;">
        <div class="provider">新しいカテゴリを追加</div>
        <!-- 通常時はこの1つの入力欄のみ。同名カテゴリを送信すると .form-field に error クラスが付き、
             下に DUPLICATE_CATEGORY_NAME のエラーメッセージが表示される(状態はここに重ねて表現) -->
        <div class="form-field error" style="max-width: 320px; margin-bottom: 0;">
          <label>カテゴリ名</label>
          <div style="display:flex; gap: 8px;">
            <input type="text" value="積読" style="flex:1;">
            <button class="btn btn-accent btn-sm">追加</button>
          </div>
          <span class="field-error">DUPLICATE_CATEGORY_NAME: 同名のカテゴリが既に存在します</span>
        </div>
      </div>

      <!-- ② 一覧セクション: GET /categories(一覧取得)・カテゴリ名の変更に対応するエンドポイントは現状ドキュメントに無く、
           この一覧・削除UIのみ先行実装です(バックエンド実装時に一覧取得APIの追加が必要)。
           件数はUI側集計(01_home.htmlのサイドバー件数と同様)。 -->
      <div class="form-section-title">登録済みのカテゴリ(3件)</div>

      <!-- カテゴリクラウド。× は DELETE /categories/{id} に対応(付け外し用の /items/{id}/categories/{category_id} とは別) -->
      <div class="prop-taglist">
        <span class="tag-pill">積読 ×</span>
        <span class="tag-pill">お気に入り原作 ×</span>
        <span class="tag-pill">2026年鑑賞予定 ×</span>
      </div>
    </div>
  </main>

</div>
</body>
</html>
