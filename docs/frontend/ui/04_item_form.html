<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>MediaVault — 手動追加・編集（一般メディア）</title>
<link rel="stylesheet" href="_shared.css">
</head>
<body>
<div class="app-shell">

  <aside class="sidebar">
    <div class="brand"><span class="dot"></span>MediaVault</div>
    <div class="nav-section">
      <div class="nav-item">📚 全体一覧</div>
      <div class="nav-item active">🎬 一般メディア</div>
      <div class="nav-item indent">　アニメ</div>
      <div class="nav-item indent">　映画</div>
      <div class="nav-item indent">　ドラマ</div>
      <div class="nav-item indent">　漫画</div>
      <div class="nav-item indent">　小説</div>
      <div class="nav-item indent">　ゲーム</div>
      <div class="nav-item">🎓 学術書・専門書</div>
      <div class="nav-item">📄 論文・文献</div>
    </div>
    <div class="nav-section">
      <div class="nav-section-label">ライブラリ</div>
      <div class="nav-item">⭐ マイリスト</div>
      <div class="nav-item">🏷️ タグ・カテゴリ</div>
      <div class="nav-item">👤 スタッフ</div>
    </div>
    <div class="nav-section" style="margin-top: auto;">
      <div class="nav-item">⚙️ 設定</div>
    </div>
  </aside>

  <main class="main">
    <div class="titlebar">
      <h1>作品を編集</h1>
    </div>

    <div class="content">
      <form class="form-grid">

        <div class="form-field full">
          <label>media_type <span class="required">必須</span></label>
          <select>
            <option>anime</option>
            <option>movie</option>
            <option>drama</option>
            <option>manga</option>
            <option>novel</option>
            <option>game</option>
          </select>
        </div>

        <div class="form-field error">
          <label>title <span class="required">必須</span></label>
          <input type="text" value="">
          <span class="field-error">タイトルは必須です</span>
        </div>

        <div class="form-field">
          <label>original_title</label>
          <input type="text" placeholder="原題（任意）">
        </div>

        <div class="form-field full">
          <label>description</label>
          <textarea placeholder="概要・あらすじ">惑星間移民船で生まれ育った少女が、失われた「地球の音楽」を巡って旅をするSFアニメ。</textarea>
        </div>

        <div class="form-field">
          <label>cover_image_url</label>
          <input type="text" placeholder="https://...">
        </div>

        <div class="form-field">
          <label>release_date</label>
          <input type="date" value="2024-04-06">
        </div>

        <div class="form-field">
          <label>status</label>
          <select>
            <option>未着手</option>
            <option selected>視聴中</option>
            <option>視聴済</option>
          </select>
        </div>

        <div class="form-field">
          <label>consumed_date</label>
          <input type="date">
          <span class="field-hint">読了/観賞済みの場合に入力</span>
        </div>

        <div class="form-field">
          <label>rating</label>
          <input type="number" min="0" max="5" step="0.5" value="4.0">
        </div>

        <div class="form-field">
          <label>is_favorite</label>
          <select>
            <option selected>★ お気に入りに登録する</option>
            <option>登録しない</option>
          </select>
        </div>

        <div class="form-field full">
          <label>homepage_url</label>
          <input type="text" placeholder="https://...">
        </div>

        <div class="form-field full">
          <label>studio（アニメ独自項目）</label>
          <input type="text" value="Orbital Works">
        </div>

        <div class="form-field full">
          <label>genre_list（アニメ独自項目）</label>
          <input type="text" value="SF, ドラマ" placeholder="カンマ区切り">
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-accent">保存する</button>
          <a href="02_item_detail.html" class="btn btn-ghost">キャンセル</a>
        </div>
      </form>
    </div>
  </main>

</div>
</body>
</html>
