<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>MediaVault — 作品を追加(論文・文献)</title>
<link rel="stylesheet" href="_shared.css">
<script src="_shared.js" defer></script>
</head>
<body>
<div class="app-shell">

  <!-- サイドバー(01_home.htmlと共通、「論文・文献」をactiveに) -->
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span>MediaVault</div>

    <div class="nav-section">
      <a href="01_home.html" class="nav-item" style="text-decoration:none;">📚 ホーム<span class="count">128</span></a>
    </div>
    <div class="nav-section">
      <div class="nav-section-label">メディア</div>
      <a href="02_general_media.html" class="nav-item" style="text-decoration:none;">🎬 すべて<span class="count">96</span></a>
      <a href="02_general_media.html" class="nav-item" style="text-decoration:none;">🎥 映画<span class="count">9</span></a>
      <a href="02_general_media.html" class="nav-item" style="text-decoration:none;">📽️ ドラマ</a>
      <a href="02_general_media.html" class="nav-item" style="text-decoration:none;">📺 アニメ<span class="count">28</span></a>
      <a href="02_general_media.html" class="nav-item" style="text-decoration:none;">📘 漫画<span class="count">34</span></a>
      <a href="02_general_media.html" class="nav-item" style="text-decoration:none;">📖 小説<span class="count">15</span></a>
      <a href="02_general_media.html" class="nav-item" style="text-decoration:none;">🎮 ゲーム<span class="count">3</span></a>
    </div>

    <div class="nav-section">
      <div class="nav-section-label">リサーチ</div>
      <a href="03_academic_books.html" class="nav-item" style="text-decoration:none;">🎓 学術書・専門書<span class="count">21</span></a>
      <a href="04_papers.html" class="nav-item active" style="text-decoration:none;">📄 論文・文献<span class="count">11</span></a>
    </div>

    <div class="nav-section">
      <div class="nav-section-label">コレクション</div>
      <a href="06_mylists.html" class="nav-item" style="text-decoration:none;">⭐ マイリスト</a>
    </div>

    <div class="nav-section" style="margin-top: auto;">
      <div class="nav-section-label">Misc</div>
      <a href="19_settings.html" class="nav-item" style="text-decoration:none;">⚙️ 設定</a>
      <button type="button" class="theme-toggle" data-theme-toggle aria-label="表示モード切替">🌓 ライトモードに切り替え</button>
    </div>
  </aside>

  <!-- メイン -->
  <main class="main">
    <div class="titlebar">
      <h1>作品を追加</h1>
    </div>

    <div class="content">
      <!-- POST /items ( media_type: paper 固定。種別セレクトは無い )。
           種別固有情報は details キーにネストして送信する。 -->
      <form>
        <div class="form-section-title">基本情報</div>
        <div class="form-grid">
          <div class="form-field full">
            <label>タイトル<span class="required">必須</span></label>
            <input type="text" placeholder="例: 埋め込み空間における意味距離の再評価">
          </div>
          <div class="form-field">
            <label>発表日</label>
            <input type="date">
          </div>
          <div class="form-field">
            <label>評価</label>
            <input type="number" min="0" max="5" step="0.1" placeholder="0.0 〜 5.0">
          </div>
          <div class="form-field full">
            <label>概要</label>
            <textarea placeholder="論文の概要・アブストラクトを入力してください"></textarea>
          </div>
          <div class="form-field">
            <label>関連サイトURL</label>
            <input type="text" placeholder="https://... (リポジトリ・出版社ページ等)">
          </div>
          <div class="form-field">
            <label>閲読状態</label>
            <!-- 実装時は作成後の変更を PATCH /items/{id}/status(status, consumed_date) の別リクエストとして送る -->
            <select>
              <option selected>未着手</option>
              <option>視聴中</option>
              <option>視聴済</option>
            </select>
          </div>
          <div class="form-field">
            <label>お気に入り</label>
            <select>
              <option value="false" selected>登録しない</option>
              <option value="true">お気に入りに登録する</option>
            </select>
          </div>
        </div>

        <div class="form-section-title">種別固有情報</div>
        <div class="form-grid">
          <div class="form-field">
            <label>DOI</label>
            <input type="text" placeholder="例: 10.1234/jnlp.2026.0032">
          </div>
          <div class="form-field">
            <label>掲載誌名</label>
            <input type="text" placeholder="例: 言語処理学会誌">
          </div>
          <div class="form-field">
            <label>巻号</label>
            <input type="text" placeholder="例: Vol.32 No.4">
          </div>
          <div class="form-field">
            <label>掲載ページ範囲</label>
            <input type="text" placeholder="例: 123-140">
          </div>
          <div class="form-field full">
            <label>著者一覧</label>
            <textarea placeholder="1行に1名ずつ入力してください&#10;例:&#10;山田 太郎&#10;佐藤 花子"></textarea>
            <span class="field-hint">著者が複数いる場合は改行で区切って入力してください</span>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-accent">保存する</button>
          <a href="04_papers.html" class="btn btn-ghost">キャンセル</a>
        </div>
      </form>
    </div>
  </main>

</div>
</body>
</html>
