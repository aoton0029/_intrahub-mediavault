      <a href="02_general_media.html" class="nav-item indent" style="text-decoration:none;">　漫画<span class="count">15</span></a>
      <a href="02_general_media.html" class="nav-item indent" style="text-decoration:none;">　小説<span class="count">7</span></a>
      <a href="02_general_media.html" class="nav-item indent" style="text-decoration:none;">　ゲーム<span class="count">3</span></a>

  <!-- メイン -->
  <main class="main">
    <div class="titlebar">
      <h1>作品を追加</h1>
    </div>

    <div class="content">
      <!-- POST /items (source は manual 固定でサーバ側が設定、リクエストに含めない)。
           media_type はここで選んだ値をそのまま送信し、作成後の編集は不可(PATCH /items/{id} では変更できない)。
           種別固有情報は details キーにネストして1つのオブジェクトとして送信する。 -->
      <form>
        <div class="form-section-title">基本情報</div>
        <div class="form-grid">
          <div class="form-field">
            <label>種別<span class="required">必須</span></label>
            <select>
              <option value="anime" selected>アニメ</option>
              <option value="movie">映画</option>
              <option value="drama">ドラマ</option>
              <option value="manga">漫画</option>
              <option value="novel">小説</option>
              <option value="game">ゲーム</option>
            </select>
            <span class="field-hint">種別を変更すると、下の「種別固有情報」の項目が切り替わります</span>
          </div>
          <div class="form-field">
            <label>タイトル<span class="required">必須</span></label>
            <input type="text" placeholder="例: 星屑のシンフォニア">
          </div>
          <div class="form-field">
            <label>原題</label>
            <input type="text" placeholder="例: Symphonia of Stardust">
          </div>
          <div class="form-field">
            <label>発売日・公開日</label>
            <input type="date">
          </div>
          <div class="form-field full">
            <label>あらすじ・概要</label>
            <textarea placeholder="作品の概要を入力してください"></textarea>
          </div>
          <div class="form-field">
            <label>カバー画像URL</label>
            <input type="text" placeholder="https://...">
          </div>
          <div class="form-field">
            <label>公式サイトURL</label>
            <input type="text" placeholder="https://...">
          </div>
          <div class="form-field">
            <label>評価</label>
            <input type="number" min="0" max="5" step="0.1" placeholder="0.0 〜 5.0">
          </div>
          <div class="form-field">
            <label>視聴状態</label>
            <!-- 実装時は作成後の変更を PATCH /items/{id}/status(status, consumed_date) の別リクエストとして送る -->
            <select>
              <option selected>未着手</option>
              <option>視聴中</option>
              <option>視聴済</option>
            </select>
          </div>
          <div class="form-field">
            <label>お気に入り</label>
            <select>
              <option value="false" selected>登録しない</option>
              <option value="true">お気に入りに登録する</option>
            </select>
          </div>
        </div>

        <!-- 種別固有情報(details)。以下は「アニメ」選択時の例。他の種別を選んだ場合はこの一式が入れ替わる:
             映画 → 上映時間(分)・監督
             ドラマ → 話数・シーズン数・放送局
             漫画 → 巻数・話数・作者・作画・掲載誌
             小説 → 巻数・著者・出版社・ISBN
             ゲーム → 対応プラットフォーム・開発元・発売元・Steam AppID -->
        <div class="form-section-title">種別固有情報(アニメ)</div>
        <div class="form-grid">
          <div class="form-field">
            <label>話数</label>
            <input type="number" min="0" placeholder="例: 24">
          </div>
          <div class="form-field">
            <label>シーズン数</label>
            <input type="number" min="0" placeholder="例: 1">
          </div>
          <div class="form-field">
            <label>制作スタジオ</label>
            <input type="text" placeholder="例: スタジオ・ノヴァ">
          </div>
          <div class="form-field">
            <label>原作形態</label>
            <input type="text" placeholder="例: オリジナル / 漫画 / 小説">
          </div>
          <div class="form-field full">
            <label>ジャンル</label>
            <input type="text" placeholder="カンマ区切りで入力(例: SF, 青春)">
            <span class="field-hint">複数のジャンルはカンマ(,)で区切って入力してください</span>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-accent">保存する</button>
          <a href="02_general_media.html" class="btn btn-ghost">キャンセル</a>
        </div>
      </form>
    </div>
  </main>

</div>
</body>
</html>
