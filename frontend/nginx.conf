server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # mediavault-apiのホスト名はnginx起動時に一度だけ解決してキャッシュする（静的proxy_pass）。
    # docker-compose.ymlでmediavault-webはmediavault-api(service_healthy)にdepends_onしているため、
    # nginx起動時には必ずmediavault-apiが存在・健全な状態になっている。
    # 【注意】: mediavault-apiコンテナを単体で再作成しIPが変わった場合はnginx側の再起動が必要
    # （docker compose restart mediavault-web）。
    # 以前はproxy_passを変数化しリクエスト毎に動的DNS解決していたが、リクエストが集中すると
    # Dockerの埋め込みDNS(127.0.0.11)への問い合わせがバーストし、解決失敗による502が
    # 断続的に発生する問題があったため静的解決に変更した。
    #
    # backendは/api/v1配下にAPIをnestしているため（main.rs参照）、
    # proxy_pass側にパスを付与せずオリジンのURIをそのまま転送する。

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://mediavault-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }
}
