server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Dockerの埋め込みDNS(127.0.0.11)を使い、backendのホスト名をリクエスト時に動的解決する。
    # 静的にproxy_passへホスト名を書くとnginx起動時にDNS解決を試みてしまい、
    # backend未起動時にnginx自体が起動失敗する（EDGE-002の想定に反する）ため変数化している。
    # 【注意】: proxy_passに変数を使う場合、nginxはlocationプレフィックスの自動置換を行わず
    # 元のリクエストURIをそのまま転送する。backendは/api/v1配下にAPIをnestしているため
    # （main.rs参照）、proxy_pass側にパスを付与せずオリジンのURIをそのまま転送する。
    resolver 127.0.0.11 valid=30s;
    set $backend_upstream http://backend:8080;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }
}